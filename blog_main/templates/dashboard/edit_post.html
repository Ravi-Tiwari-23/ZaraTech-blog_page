{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Edit post | ZaraTech{% endblock %}
{% block content %}
<div class="row">{% include 'dashboard/sidebar.html' %}<div class="col-md-9"><h2>Edit Post</h2><p class="text-muted">The public URL stays <code>{{ post.slug }}</code> when the title changes.</p><form action="{% url 'edit_post' post.id %}" method="POST" enctype="multipart/form-data" class="card card-body border-0 shadow-sm">{% csrf_token %}{{ form|crispy }}<div><button type="submit" class="btn btn-warning">Save changes</button> <a href="{% url 'posts' %}" class="btn btn-light">Cancel</a></div></form></div></div>
{% endblock %}
