{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ page_title }} | ZaraTech Dashboard{% endblock %}
{% block content %}
<div class="row">
    {% include 'dashboard/sidebar.html' %}
    <div class="col-md-9">
        <h2>{{ page_title }}</h2>
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-warning">{{ submit_label }}</button>
                    <a href="{% url 'dashboard_social_links' %}" class="btn btn-light ml-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
