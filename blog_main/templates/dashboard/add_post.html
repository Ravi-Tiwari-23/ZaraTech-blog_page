{% extends 'base.html' %}
{% block title %}Create post | GenVilla Insights{% endblock %}
{% block content %}
<div class="row">
    <!-- Left sidebar -->
    <!-- load the sidebar here -->
    {% include 'dashboard/sidebar.html' %}


    <!-- Right side content -->
    <div class="col-md-9">
        <h2>Add New Post</h2>

        <form action="{% url 'add_post' %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {% include 'dashboard/_blog_form_fields.html' %}
            <button type="submit" class="btn btn-warning">Submit</button>
        </form>
        <br>


    </div>
</div>


{% endblock %}
